[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "empool"
version = "0.1.0"
description = "A topological graph reduction framework for optimizing GNN training"
authors = [
    {name = "Diaa Eddine Zaini"}
]
dependencies = [
    "torch",
    "torch_geometric",
    "torch_scatter"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "data*"]